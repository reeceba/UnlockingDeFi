<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINTFORGE</title><style>body{margin:0;background:#08090c;color:#f6f7fb;font:16px system-ui}header{padding:18px 5%;border-bottom:1px solid #252932;display:flex;justify-content:space-between;position:sticky;top:0;background:#08090cf5}.logo{font-weight:900;letter-spacing:.1em}.logo span{color:#9dff00}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.connect,.pay{background:#9dff00;color:#070900}.wrap{max-width:1100px;margin:auto;padding:35px 5%}.ey{color:#9dff00;font-weight:900;letter-spacing:.15em;font-size:11px}h1{font-size:clamp(42px,7vw,76px);line-height:.92}.muted{color:#949aa7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#111318;border:1px solid #252932;border-radius:18px;overflow:hidden}.art{height:170px;display:grid;place-items:center;background:radial-gradient(circle,#263500,#10130d 55%,#0c0e12);font-size:60px}.body{padding:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.buy{background:#fff}.cart{position:fixed;right:18px;bottom:18px;width:min(390px,calc(100% - 36px));background:#111318;border:1px solid #252932;border-radius:18px;padding:20px;display:none;box-shadow:0 20px 60px #000b}.open{display:block}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #252932}.qty button{padding:4px 8px;background:#252932;color:#fff}.remove{background:none;color:#ff7373;padding:4px}.pay{width:100%;margin-top:15px}.status{color:#949aa7;font-size:12px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="logo">MINT<span>FORGE</span></div><button class="connect" id="connect">CONNECT SOLFLARE</button></header><main class="wrap"><div class="ey">SOLANA • 3D PRINTS • WEB3</div><h1>PHYSICAL GOODS.<br>ON-CHAIN PAYMENTS.</h1><p class="muted">MINTFORGE V1 test store.</p><p class="muted" id="wallet">Wallet not connected</p><div class="ey">SHOP</div><h2>Featured products</h2><div class="grid" id="products">Loading…</div></main><div class="cart" id="cart"><h3>Your cart</h3><div id="items"></div><div class="row"><b>Total</b><b id="total">$0.00</b></div><button class="pay" id="checkout">CHECKOUT WITH SOL</button><div class="status" id="status"></div></div><script>const U='https://zezusfnbqvijldhxoejd.supabase.co',A=U+'/functions/v1/storefront-public',C=U+'/functions/v1/create-checkout-v2';let P=[],cart=[],wallet=null,$=x=>document.getElementById(x);async function load(){try{let r=await fetch(A),d=await r.json();P=d.products||[]}catch(e){}if(!P.length)P=[{id:'70084fbe-1b85-480f-8092-0ab706894853',name:'MINTFORGE Test Print',description:'$1 dummy product for checkout testing only.',price:1,stock:100,category:'TEST PRODUCT'},{id:'bdb64445-d505-4320-a378-71775053c6cc',name:'Solana Gecko',description:'MINTFORGE collectible 3D print.',price:35,stock:12,category:'3D PRINT'},{id:'8b1b62be-a3bf-410e-b436-0ffd952a5ac7',name:'MINTFORGE Keychain',description:'Compact Web3 collectible keychain.',price:18,stock:28,category:'KEYCHAIN'}];render()}function render(){$('products').innerHTML=P.map(p=>`<article class="card"><div class="art">${p.name.includes('Gecko')?'🦎':p.name.includes('Keychain')?'🔑':'🧪'}</div><div class="body"><div class="ey">${p.category||'3D PRINT'}</div><h3>${p.name}</h3><p class="muted">${p.description||''}</p><div class="row"><b>$${Number(p.price).toFixed(2)} USD</b><button class="buy" onclick="add('${p.id}')">ADD TO CART</button></div></div></article>`).join('');draw()}function add(id){let p=P.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(x)x.q=Math.min(x.q+1,p.stock);else cart.push({id,name:p.name,price:+p.price,q:1,stock:p.stock});draw()}function ch(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.q=Math.max(0,Math.min(x.q+d,x.stock));if(!x.q)cart=cart.filter(y=>y.id!==id);draw()}function rm(id){cart=cart.filter(x=>x.id!==id);draw()}function draw(){$('cart').classList.toggle('open',cart.length>0);$('items').innerHTML=cart.map(x=>`<div class="item"><span>${x.name}<br><button onclick="ch('${x.id}',-1)">−</button> ${x.q} <button onclick="ch('${x.id}',1)">+</button> <button class="remove" onclick="rm('${x.id}')">Remove</button></span><b>$${(x.price*x.q).toFixed(2)}</b></div>`).join('');$('total').textContent='$'+cart.reduce((a,x)=>a+x.price*x.q,0).toFixed(2)+' USD'}async function connect(){let p=window.solflare?.isSolflare?window.solflare:(window.solana?.isSolflare?window.solana:window.solana);if(!p){alert('Open this HTTPS page inside Solflare.');return}try{let r=await p.connect();wallet=r.publicKey?.toString()||p.publicKey?.toString();$('wallet').textContent='Connected: '+wallet.slice(0,6)+'…'+wallet.slice(-6);$('connect').textContent='CONNECTED'}catch(e){}}$('connect').onclick=connect;$('checkout').onclick=async()=>{if(!wallet){await connect();if(!wallet)return}$('status').textContent='Creating secure checkout…';try{let r=await fetch(C,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart.map(x=>({product_id:x.id,quantity:x.q})),wallet_address:wallet,shipping:{country:'Australia'}})}),d=await r.json();if(!r.ok)throw Error(d.error||'Checkout failed');$('status').textContent='Order created: '+d.order.id+'\nPayment signing is next.'}catch(e){$('status').textContent=e.message}};load();</script></body></html>
